# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# There are two types of configuration data in Jekyll:
#
# 1. 'Environment variables.' These are specific to the software operating
#    environment. They affect how Jekyll is supposed to work.
# 2. 'Front matter defaults.' They don't have anything to do with the kind of
#    style of your website. They only change the kinds of defaults
#    being displayed to you. If you find that you need to change the
#    subtitle or other introductory heading of certain pages, in fact
#    these types of defaults reside within the "navigation.yml" file in
#    the "_data" folder.

# Site settings
title: "Junteng Liu"
name: "Junteng Liu"
description: "Junteng Liu is a first-year PhD candidate at HKUST NLP Group working on natural language processing and machine learning."
url: "https://33chill-automation.github.io"
baseurl: "/LJT-Homepage"

# Build settings
markdown: kramdown
theme: minimal_mistakes
gems:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-twitter-plugin
  - jemoji

# Plugins
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-twitter-plugin
  - jemoji

# Permalinks
permalink: /:categories/:year/:month/:day/:title/

# Collection settings
collections:
  posts:
    output: true
  publications:
    output: true
    permalink: /:collection/:name/
  talks:
    output: true
    permalink: /:collection/:name/
  teaching:
    output: true
    permalink: /:collection/:name/
  portfolio:
    output: true
    permalink: /:collection/:name/

# Author settings
author:
  name: "Junteng Liu"
  avatar: "bio-photo-2.jpg"
  bio: "First-year PhD candidate at HKUST NLP Group."
  location: "Hong Kong"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"
  email: "jliugi@connect.ust.hk"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jliugi@connect.ust.hk"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/junteng88716710"

# Social media handles
github_username: Vicent0205
twitter_username: junteng88716710

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/

# Feed settings
feed:
  path: "feed/index.xml"

# Other settings
include:
  - "index.html"
  - "og_image.jpg"

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      share: false
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
      share: false
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "single"
      author_profile: true
      share: false
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "single"
      author_profile: true
      share: false
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "single"
      author_profile: true
      share: false
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
      share: false
